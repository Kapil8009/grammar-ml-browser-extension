name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend tests
      - run: pytest --cov=backend --cov-report=term-missing
      - run: python -m json.tool extension/manifest.json >/dev/null
      - run: node --check extension/background.js
      - run: node --check extension/content/content.js
      - run: node --check extension/popup/popup.js
      - run: node --check extension/options/options.js
