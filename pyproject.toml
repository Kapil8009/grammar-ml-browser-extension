[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-ml"
version = "1.0.0"
description = "Modular ML grammatical error correction API and browser extension"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.4,<1",
]
train = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.4,<1",
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
